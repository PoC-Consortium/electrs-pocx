name: electrs

on:
  push:
    branches:
      - btcx
  pull_request:

jobs:
  build:
    name: Build

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        build-args:
          [
            --locked --no-default-features,
            --locked
          ]
        include:
          - os: ubuntu-latest
            build-args: --locked --features metrics_process

    steps:
      - uses: actions/checkout@v6

      # bindex is a path dependency (../bindex-btcx/bindex-lib); clone the
      # sibling repo one level above the workspace, matching the local layout.
      - name: Checkout bindex-btcx (path dependency)
        run: git clone --depth 1 --branch btcx https://github.com/PoC-Consortium/bindex-btcx ../bindex-btcx

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Rust
        run: rustup component add rustfmt clippy

      - name: Install other dependencies
        run: sudo apt install build-essential libclang-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build ${{ matrix.build-args }} --all

      - name: Test
        run: cargo test  ${{ matrix.build-args }} --all

      - name: Clippy
        run: cargo clippy -- -D warnings

  # The upstream "Integration" job (Dockerfile.ci against vanilla bitcoind) is
  # removed on this branch: the docker build context cannot see the bindex
  # path dependency, and the test exercises stock Bitcoin Core, which is not
  # meaningful for the Bitcoin PoCX port. Port validation lives in testkit/
  # and the release workflow.
