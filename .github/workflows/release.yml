name: Release

# Builds release binaries for Linux (x86_64/aarch64, gnu/musl) and Windows (x64),
# then attaches them to a GitHub release when a tag is pushed.
#
# Two variants are built for every target:
#   pocx    - the PoCX port (the tagged commit); depends on
#             ../bindex-pocx/bindex-lib via a path dependency, so both
#             repositories are checked out side by side
#   bitcoin - vanilla electrs for Bitcoin Core, built from this repo's
#             master branch (upstream romanz/electrs); bindex comes from
#             crates.io

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Build ${{ matrix.target }} (${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        variant: [ pocx, bitcoin ]
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm

    steps:
    - name: Checkout electrs (PoCX)
      if: matrix.variant == 'pocx'
      uses: actions/checkout@v6
      with:
        path: electrs

    - name: Checkout bindex-pocx
      if: matrix.variant == 'pocx'
      uses: actions/checkout@v6
      with:
        repository: PoC-Consortium/bindex-pocx
        ref: pocx
        path: bindex-pocx

    - name: Checkout electrs (vanilla, master)
      if: matrix.variant == 'bitcoin'
      uses: actions/checkout@v6
      with:
        ref: master
        path: electrs

    - name: Install dependencies (gnu)
      if: contains(matrix.target, 'gnu')
      run: sudo apt-get -qqy install build-essential libclang-dev

    - name: Install Rust (gnu)
      if: contains(matrix.target, 'gnu')
      uses: dtolnay/rust-toolchain@stable

    - name: Build and sanity check (gnu)
      if: contains(matrix.target, 'gnu')
      working-directory: electrs
      run: |
        cargo build --release --locked --target ${{ matrix.target }}
        target/${{ matrix.target }}/release/electrs --version
        target/${{ matrix.target }}/release/electrs --help
        install -D target/${{ matrix.target }}/release/electrs "$GITHUB_WORKSPACE/out/electrs"

    # musl targets build natively inside an Alpine container (no cross-compiling
    # RocksDB). Run via docker instead of `container:` because GitHub's JS
    # actions (checkout etc.) don't work in Alpine containers on arm64 runners.
    #
    # Alpine's packaged Rust is used instead of rustup: rustup's musl toolchain
    # links build scripts statically (crt-static is the musl default), and the
    # librocksdb-sys build script then segfaults when bindgen dlopen()s
    # libclang. Alpine's Rust defaults to dynamic linking, so build scripts and
    # proc macros work; +crt-static is applied only to the final binary via
    # RUSTFLAGS, which cargo restricts to the --target units.
    - name: Build and sanity check (musl)
      if: contains(matrix.target, 'musl')
      run: |
        docker run --rm -v "$PWD:/work" -w /work/electrs alpine:3.23 sh -c '
          set -ex
          apk add --no-cache build-base libstdc++-dev linux-headers clang21-libclang rust cargo
          HOST_TRIPLE=$(rustc -vV | sed -n "s/^host: //p")
          export RUSTFLAGS="-C target-feature=+crt-static"
          # RocksDB 9.10 headers assume transitive <cstdint> includes, dropped in GCC 15
          export CXXFLAGS="-include cstdint"
          cargo build --release --locked --target "$HOST_TRIPLE"
          "target/$HOST_TRIPLE/release/electrs" --version
          install -D "target/$HOST_TRIPLE/release/electrs" /work/out/electrs
        '
        # a fully static musl binary must also run on the glibc host
        out/electrs --version
        out/electrs --help

    - name: Package
      run: |
        short=$(echo ${{ matrix.target }} | sed 's/-unknown//')
        tar -czf electrs-${{ matrix.variant }}-${{ github.ref_name }}-$short.tar.gz -C out electrs

    - uses: actions/upload-artifact@v7
      with:
        name: electrs-${{ matrix.variant }}-${{ matrix.target }}
        path: electrs-*.tar.gz
        if-no-files-found: error

  windows:
    name: Build x86_64-pc-windows-msvc (${{ matrix.variant }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        variant: [ pocx, bitcoin ]

    env:
      # for bindgen (librocksdb-sys); LLVM is preinstalled on the runner image
      LIBCLANG_PATH: C:\Program Files\LLVM\bin

    steps:
    - name: Checkout electrs (PoCX)
      if: matrix.variant == 'pocx'
      uses: actions/checkout@v6
      with:
        path: electrs

    - name: Checkout bindex-pocx
      if: matrix.variant == 'pocx'
      uses: actions/checkout@v6
      with:
        repository: PoC-Consortium/bindex-pocx
        ref: pocx
        path: bindex-pocx

    - name: Checkout electrs (vanilla, master)
      if: matrix.variant == 'bitcoin'
      uses: actions/checkout@v6
      with:
        ref: master
        path: electrs

    - uses: dtolnay/rust-toolchain@stable

    - name: Build
      working-directory: electrs
      run: cargo build --release --locked

    - name: Sanity
      working-directory: electrs
      run: |
        target\release\electrs.exe --version
        target\release\electrs.exe --help

    - name: Package
      run: Compress-Archive -Path electrs\target\release\electrs.exe -DestinationPath electrs-${{ matrix.variant }}-${{ github.ref_name }}-x86_64-windows.zip

    - uses: actions/upload-artifact@v7
      with:
        name: electrs-${{ matrix.variant }}-x86_64-pc-windows-msvc
        path: electrs-*.zip
        if-no-files-found: error

  release:
    name: Create release
    needs: [ linux, windows ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        generate_release_notes: true
