name: Build and Push Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Main Dockerfile)
        id: meta-main
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and Push Main Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ id.meta-main.outputs.tags }}
          labels: ${{ id.meta-main.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata (CI Dockerfile)
        id: meta-ci
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-ci
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and Push CI Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          tags: ${{ id.meta-ci.outputs.tags }}
          labels: ${{ id.meta-ci.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata (All-in-One Dockerfile)
        id: meta-all
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-all
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and Push All-in-One Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.all
          push: true
          tags: ${{ id.meta-all.outputs.tags }}
          labels: ${{ id.meta-all.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
